<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="__CSRF_TOKEN__">
    <title>ProcessOn 设置</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <div class="brand-lockup">
        <img src="/logo.png" alt="" width="28" height="28">
        <strong>ProcessOn</strong>
        <span>Setup</span>
      </div>
      <h1>三步完成首次设置</h1>
      <p class="subtitle">保存你的 ProcessOn Token，即可在 Codex 中开始设计</p>
      <section class="setup-card" aria-label="ProcessOn Token 设置">
        <div class="setup-step">
          <b>1　获取 Token</b>
          <a href="https://smart.processon.com/user" target="_blank" rel="noreferrer">打开 ProcessOn 用户中心</a>
          <p>创建并复制个人 Token，请勿发送到聊天。</p>
        </div>
        <div class="setup-step">
          <b>2　保存到本机</b>
          <div class="input-row">
            <input id="token" name="token" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴 ProcessOn Token" aria-describedby="status">
            <button id="save" type="button">保存</button>
          </div>
          <p id="status" class="status" role="status" aria-live="polite">Token 只保存在当前用户的本机配置中。</p>
        </div>
        <div class="setup-step">
          <b>3　打开 Codex</b>
          <button id="launch" type="button" disabled>打开 Codex</button>
          <p>保存成功后重新打开 Codex，并只读列出 ProcessOn 工具。</p>
        </div>
        <details>
          <summary>高级设置</summary>
          <p>高级用户可使用 <code>PROCESSON_MCP_TOKEN</code> 环境变量或配置器的 <code>run</code> 命令。</p>
        </details>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
