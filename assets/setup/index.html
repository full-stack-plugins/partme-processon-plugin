<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProcessOn 设置</title><link rel="stylesheet" href="/styles.css"></head>
<body><main><div class="brand"><img src="/logo.png" alt="" width="28" height="28"> ProcessOn <span>Setup</span></div><h1>三步完成首次设置</h1><p class="subtitle">保存你的 ProcessOn Token，即可在 Codex 中开始设计</p>
<section class="setup-card" data-csrf="__CSRF_TOKEN__">
<div class="setup-step"><b>1　获取 Token</b><a href="https://smart.processon.com/user" target="_blank" rel="noreferrer">打开 ProcessOn 用户中心</a><p>创建并复制 Token，请勿发送到聊天。</p></div>
<div class="setup-step"><b>2　保存到本机</b><div class="input-row"><input id="token" type="password" autocomplete="off" placeholder="粘贴 ProcessOn Token"><button id="save">保存</button></div><p id="status" aria-live="polite">Token 只保存在当前用户的本机配置中。</p></div>
<div class="setup-step"><b>3　打开 Codex</b><button id="launch" disabled>打开 Codex</button><p>保存成功后重新打开 Codex，并只读列出 ProcessOn 工具。</p></div>
<details><summary>高级设置</summary><p>高级用户可使用 PROCESSON_MCP_TOKEN 环境变量或运行配置器的 run 命令。</p></details>
</section></main><script src="/app.js"></script></body></html>
